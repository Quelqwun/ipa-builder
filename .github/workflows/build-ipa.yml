name: Build Shop2Speed iOS (Xcode 27)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Compiler Shop2Speed iOS
    runs-on: xcode-27 # Cible l'environnement macOS ARM64 avec Xcode 27

    steps:
      - name: 1. Cloner le dépôt
        uses: actions/checkout@v4

      - name: 2. Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm' # Remplacez par 'yarn' ou 'pnpm' si vous utilisez un autre gestionnaire

      - name: 3. Installer les dépendances du projet
        run: npm ci
        # *Vérification :* Le dossier node_modules est présent et les dépendances sont installées sans erreur critique.

      - name: 4. Générer les dossiers natifs (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean
        # *Vérification :* Le dossier "ios/" est créé à la racine du projet et contient le fichier Shop2Speed.xcworkspace.

      - name: 5. Installer les pods CocoaPods
        run: |
          cd ios
          pod install
        # *Vérification :* La commande s'achève avec le message "Pod installation complete!" sans erreurs de dépendances CocoaPods.

      - name: 6. Compiler l'application en mode Release (xcodebuild)
        run: |
          cd ios
          xcodebuild -workspace Shop2Speed.xcworkspace \
                     -scheme Shop2Speed \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        # *Vérification :* La compilation se termine par la mention "** BUILD SUCCEEDED **".

      - name: 7. Sauvegarder l'artefact compilé (.app)
        uses: actions/upload-artifact@v4
        with:
          name: Shop2Speed-iOS-App
          path: ios/build/Build/Products/Release-iphoneos/Shop2Speed.app
        # *Vérification :* L'artefact est bien téléchargeable depuis l'onglet "Actions" de votre dépôt GitHub après la fin du workflow.
